name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:check

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/praxislume_app
        run: flutter pub get
      - working-directory: apps/praxislume_app
        run: dart format --set-exit-if-changed .
      - working-directory: apps/praxislume_app
        run: flutter analyze
      - working-directory: apps/praxislume_app
        run: flutter test
      - working-directory: apps/praxislume_app
        run: flutter build web
